name: homelab

services:

  # DB services
  postgres:
    build:
      context: .
      dockerfile: docker/db/postgres.dockerfile
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - TZ=${TZ:-Asia/Karachi}
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - ./config/postgresql:/etc/postgresql:ro
      - postgres_data:/var/lib/postgresql
    networks:
      - internal-net
      - external-net

  # Migration services
  migrate:
    build:
      context: .
      dockerfile: docker/db/dbmate.dockerfile
    restart: "no"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - DBMATE_MIGRATIONS_DIR=/db/migrations
      - DBMATE_NO_DUMP_SCHEMA=true
    secrets:
      - postgres_password
    volumes:
      - ./db/migrations:/db/migrations
    networks:
      - internal-net
    depends_on:
      postgres:
        condition: service_healthy

  # Cache/Broker services
  valkey:
    build:
      context: .
      dockerfile: docker/db/valkey.dockerfile
    ports:
      - "${VALKEY_PORT:-6380}:6380"
    restart: unless-stopped
    secrets:
      - valkey_password
    volumes:
      - ./config/valkey/valkey.conf:/usr/local/valkey/valkey.conf:ro
      - valkey_data:/data
    networks:
      - internal-net
      - external-net

  # Web server
  nginx:
    build:
      context: .
      dockerfile: docker/server/nginx.dockerfile
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    restart: unless-stopped
    environment:
      - NGINX_HOST=${NGINX_HOST:?nginx host is required}
    volumes:
      - ./config/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./config/nginx/snippets:/etc/nginx/snippets:ro
      - ./config/nginx/certs:/etc/nginx/certs:ro
      - ./config/nginx/vhost.d:/etc/nginx/vhost.d:ro
      - ./config/nginx/htpasswd:/etc/nginx/htpasswd:ro

      - ./html:/usr/share/nginx/html:ro
    networks:
      - internal-net
      - external-net
    depends_on:
      paperless:
        condition: service_healthy
        required: false
      authentik:
        condition: service_healthy
        required: false
      authentik-worker:
        condition: service_healthy
        required: false

  # Utility services
  gotenberg:
    build:
      context: .
      dockerfile: docker/utils/gotenberg.dockerfile
    restart: unless-stopped
    networks:
      - internal-net

  tika:
    build:
      context: .
      dockerfile: docker/utils/apache-tika.dockerfile
    restart: unless-stopped
    networks:
      - internal-net

  socket-proxy:
    build:
      context: .
      dockerfile: docker/utils/socket-proxy.dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    # Need to add this if logs don't work
    # cap_add:
    #   - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run
      - /tmp
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - NETWORKS=1
      - POST=1
      - EVENTS=1
      - PING=1
      - VERSION=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-proxy-net

  # Services
  paperless:
    build:
      context: .
      dockerfile: docker/services/paperless-ngx.dockerfile
    restart: unless-stopped
    environment:
      - LANG=en_US.UTF-8
      - PAPERLESS_USERMAP_UID=${UID:-1000}
      - PAPERLESS_USERMAP_GID=${GID:-1000}

      # Web server config
      - PAPERLESS_SECRET_KEY_FILE=/run/secrets/paperless_secret_key
      - PAPERLESS_REDIS_FILE=/run/secrets/valkey_url
      - PAPERLESS_URL=http://paperless.${NGINX_HOST:?nginx host is required}
      - PAPERLESS_CSRF_TRUSTED_ORIGINS=http://paperless.${NGINX_HOST:?nginx host is required}:${HTTP_PORT:-80},https://paperless.${NGINX_HOST:?nginx host is required}:${HTTPS_PORT:-443}
      - PAPERLESS_USE_X_FORWARD_HOST=true
      - PAPERLESS_USE_X_FORWARD_PORT=true
      - PAPERLESS_PROXY_SSL_HEADER=["HTTP_X_FORWARDED_PROTO", "https"]

      # Tika Config
      - PAPERLESS_TIKA_ENABLED=1
      - PAPERLESS_TIKA_GOTENBERG_ENDPOINT=http://gotenberg:3000
      - PAPERLESS_TIKA_ENDPOINT=http://tika:9998

      # DB Config
      - PAPERLESS_DBENGINE=postgresql
      - PAPERLESS_DBHOST=postgres
      # TODO: pass these credentials securely
      - PAPERLESS_DBNAME=paperless_db
      - PAPERLESS_DBUSER=paperless_user
      - PAPERLESS_DBPASS=paperless
    secrets:
      - paperless_secret_key
      - valkey_url
    volumes:
      - paperless_data:/usr/src/paperless/data
      - paperless_media:/usr/src/paperless/media
      - ./paperless/export:/usr/src/paperless/export
      - ./paperless/consume:/usr/src/paperless/consume
    networks:
      - internal-net
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      gotenberg:
        condition: service_started
      tika:
        condition: service_started

  authentik:
    build:
      context: .
      dockerfile: docker/sso/authentik.dockerfile
    restart: unless-stopped
    shm_size: 512mb
    environment:
      - AUTHENTIK_POSTGRESQL__HOST=postgres
      - AUTHENTIK_POSTGRESQL__NAME=authentik_db
      - AUTHENTIK_POSTGRESQL__PASSWORD=authentik
      - AUTHENTIK_POSTGRESQL__USER=authentik_user
      - AUTHENTIK_SECRET_KEY=file:///run/secrets/authentik_secret_key
      - AUTHENTIK_ERROR_REPORTING__ENABLED=${AUTHENTIK_ERROR_REPORTING__ENABLED:-false}
    secrets:
      - authentik_secret_key
    volumes:
    - ./config/authentik/data:/data
    - ./config/authentik/custom-templates:/templates
    networks:
      - internal-net
    depends_on:
      migrate:
        condition: service_completed_successfully

  authentik-worker:
    build:
      context: .
      dockerfile: docker/sso/authentik-worker.dockerfile
    restart: unless-stopped
    shm_size: 512mb
    environment:
      - AUTHENTIK_POSTGRESQL__HOST=postgres
      - AUTHENTIK_POSTGRESQL__NAME=authentik_db
      - AUTHENTIK_POSTGRESQL__PASSWORD=authentik
      - AUTHENTIK_POSTGRESQL__USER=authentik_user
      - AUTHENTIK_SECRET_KEY=file:///run/secrets/authentik_secret_key
      - AUTHENTIK_ERROR_REPORTING__ENABLED=${AUTHENTIK_ERROR_REPORTING__ENABLED:-false}
    secrets:
      - authentik_secret_key
    volumes:
      - ./config/authentik/data:/data
      - ./config/authentik/certs:/certs
      - ./config/authentik/custom-templates:/templates
    networks:
      - internal-net
      - socket-proxy-net
    depends_on:
      authentik:
        condition: service_healthy
      socket-proxy:
        condition: service_started


volumes:
  postgres_data:
  valkey_data:
  paperless_data:
  paperless_media:


networks:
  internal-net:
    driver: bridge
    internal: true

  external-net:
    driver: bridge

  socket-proxy-net:
    driver: bridge
    internal: true


secrets:
  postgres_password:
    environment: POSTGRES_PASSWORD
  valkey_password:
    environment: VALKEY_PASSWORD
  valkey_url:
    environment: VALKEY_URL
  paperless_secret_key:
    environment: PAPERLESS_SECRET_KEY
  authentik_secret_key:
    environment: AUTHENTIK_SECRET_KEY
