services:
  socket-proxy:
    build:
      context: .
      dockerfile: docker/socket-proxy.dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run
      - /tmp
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - NETWORKS=1
      - POST=1
      - EVENTS=1
      - PING=1
      - VERSION=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-proxy-net


networks:
  socket-proxy-net:
    driver: bridge
    external: true
    internal: true
    name: homelab_socket-proxy-net
