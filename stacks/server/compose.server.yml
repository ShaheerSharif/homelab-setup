services:
  nginx:
    build:
      context: .
      dockerfile: docker/nginx.dockerfile
    container_name: homelab-nginx
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    restart: unless-stopped
    environment:
      - NGINX_HOST=${NGINX_HOST:?nginx host is required}
      - NGINX_PORT=80
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/vhost.d:/etc/nginx/vhost.d:ro
      - ./nginx/htpasswd:/etc/nginx/htpasswd:ro

      - ./nginx/html:/usr/share/nginx/html:ro
    networks:
      - internal-net
      - external-net


networks:
  internal-net:
    driver: bridge
    external: true
    internal: true
    name: homelab_internal-net

  external-net:
    driver: bridge
    external: true
    name: homelab_external-net
