services:
  traefik:
    build:
      context: .
      dockerfile: docker/traefik.dockerfile
    container_name: homelab-traefik
    command:
      # Docker provider via socket-proxy
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=homelab_internal-net

      # Entrypoints
      - --entrypoints.web.address=:80
      # - --entrypoints.websecure.address=:443  # Enable once https is set

      # Health and logging
      - --ping=true
      - --log.level=INFO
      - --accesslog=true
      - --api.dashboard=true  # Not exposed until a router is set for this
    ports:
      - "${HTTP_PORT:-80}:80"
    security_opt:
      - no-new-privileges:true
    read_only: true
    networks:
      - internal-net
      - external-net
      - socket-proxy-net


networks:
  internal-net:
    driver: bridge
    external: true
    internal: true
    name: homelab_internal-net

  external-net:
    driver: bridge
    external: true
    name: homelab_external-net

  socket-proxy-net:
    driver: bridge
    external: true
    internal: true
    name: homelab_socket-proxy-net
