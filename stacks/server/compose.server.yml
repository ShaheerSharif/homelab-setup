services:
  socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0
    container_name: homelab-traefik-socket-proxy
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run
      - /tmp
    environment:
      - CONTAINERS=1
      - EVENTS=1
      - PING=1
      - VERSION=1
    labels:
      - dev.dozzle.group=${DOZZLE_GROUP_LABEL:?group label is required}
    mem_limit: ${TRAEFIK__SOCKET_PROXY_MEM_LIMIT:-32m}
    memswap_limit: ${TRAEFIK__SOCKET_PROXY_MEMSWAP_LIMIT:-64m}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-proxy-net

  traefik:
    build:
      context: .
      dockerfile: docker/traefik.dockerfile
    container_name: homelab-traefik
    restart: unless-stopped
    command:
      # Docker provider via socket-proxy
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=homelab_internal-net

      # Entrypoints
      - --entrypoints.web.address=:${HTTP_PORT:-80}
      - --entrypoints.websecure.address=:${HTTPS_PORT:-443}

      # Health and logging
      - --ping=true
      - --log.level=INFO
      - --accesslog=true
      - --api.dashboard=true  # Not exposed until a router is set for this

    labels:
      - traefik.enable=true
      - traefik.docker.network=homelab_internal-net

      # Router for dashboard
      - traefik.http.routers.dashboard.rule=Host(`traefik.${DOMAIN:?base domain is required}`)
      - traefik.http.routers.dashboard.entrypoints=web
      - traefik.http.routers.dashboard.service=api@internal
      - traefik.http.routers.dashboard.middlewares=dashboard-auth
      - traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_DASHBOARD_USERS:?dashboard credentials are required}

      - dev.dozzle.group=${DOZZLE_GROUP_LABEL:?group label is required}
    ports:
      - "${HTTP_PORT:-80}:${HTTP_PORT:-80}"
    security_opt:
      - no-new-privileges:true
    read_only: true
    mem_limit: ${TRAEFIK_MEM_LIMIT:-128m}
    memswap_limit: ${TRAEFIK_MEMSWAP_LIMIT:-192m}
    networks:
      internal-net:
        aliases:
          - authentik.${DOMAIN:?base domain is required}
          - paperless.${DOMAIN:?base domain is required}
          - dozzle.${DOMAIN:?base domain is required}
      external-net:
      socket-proxy-net:
    depends_on:
      socket-proxy:
        condition: service_started


networks:
  internal-net:
    driver: bridge
    external: true
    internal: true
    name: homelab_internal-net

  external-net:
    driver: bridge
    external: true
    name: homelab_external-net

  socket-proxy-net:
    driver: bridge
    external: true
    internal: true
    name: homelab_socket-proxy-server-net
