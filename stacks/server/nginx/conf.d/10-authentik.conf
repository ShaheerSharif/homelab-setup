# Upstream where your authentik server is hosted.
upstream authentik {
    # Change to 9443 once https is enabled
    # server authentik:9443;
    server authentik:9000;

    # Improve performance by keeping some connections alive.
    keepalive 10;
}

# Upgrade WebSocket if requested, otherwise use keepalive
map $http_upgrade $connection_upgrade_keepalive {
    default upgrade;
    ''      '';
}

server {
    # HTTP server config
    listen 80;
    listen [::]:80;
    server_name authentik.homelab.internal;

    # Disable this once https is served
    include /etc/nginx/snippets/error-pages.conf;
    location / {
        proxy_pass http://authentik:9000;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_keepalive;
    }

    # Enable this only when https is served
    # 301 redirect to HTTPS
    # return 301 https://$host$request_uri;
}

