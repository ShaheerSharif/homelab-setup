# Network
bind 0.0.0.0
protected-mode yes
port 6380

# Persistence — AOF
appendonly yes
appendfsync everysec
appendfilename "appendonly.aof"
appenddirname "appendonlydir"

# Persistence — RDB snapshots (extra safety net alongside AOF)
save 3600 1
save 300 100
save 60 10000
dir /data

# Logging
loglevel notice

# Memory size
maxmemory 128mb
maxmemory-policy allkeys-lru

timeout 300
databases 8
