# True catch-all: anything NOT under homelab.internal (raw IP, bogus Host
# headers, scanners, etc.) — just drop the connection, no response body.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# Serves index.html at the root domain homelab.internal
server {
    listen 80;
    server_name homelab.internal;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

# Catches any *.homelab.internal subdomain that doesn't match a more
# specific server_name in another conf file (e.g. an unknown/unconfigured
# subdomain under your homelab domain).
server {
    listen 80;
    server_name *.homelab.internal;

    root /usr/share/nginx/html;

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location / {
        return 404;
    }
}
