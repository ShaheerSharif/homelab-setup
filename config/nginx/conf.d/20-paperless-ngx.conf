server {
    listen 80;
    server_name paperless.homelab.internal;
    client_max_body_size 100M;

    include /etc/nginx/snippets/error-pages.conf;

    # Referrer-Policy: no-referrer everywhere except the login page, which needs
    # same-origin so Django's CSRF check gets a real Origin header instead of "null"
    # on the login POST (see Troubleshooting below). proxy_hide_header clears any
    # Referrer-Policy already set upstream/elsewhere before add_header sets your own.
    location ~ ^/accounts/(signup|login)/ {

        proxy_pass http://paperless:8000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_redirect off;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Referrer-Policy;
        add_header Referrer-Policy "same-origin" always;
    }

    location / {
        proxy_pass http://paperless:8000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Referrer-Policy;
        add_header Referrer-Policy "no-referrer" always;
    }
}
