<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>503 - Service Unavailable</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 500px;
    }

    h1 {
      font-size: 8rem;
      color: #ffffff;
      line-height: 1;
    }

    h2 {
      font-size: 1.5rem;
      margin: 20px 0 10px;
      color: #ffffff;
    }

    p {
      font-size: 1rem;
      color: #a0a0a0;
      margin-bottom: 30px;
    }

    a.home-link {
      display: inline-block;
      padding: 12px 28px;
      background-color: #e0e0e0;
      color: #121212;
      text-decoration: none;
      border-radius: 5px;
      font-size: 1rem;
      transition: background-color 0.2s ease;
    }

    a.home-link:hover {
      background-color: #ffffff;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>503</h1>
    <h2>Service Unavailable</h2>
    <p>Sorry, the site is unable to handle your request.</p>
  </div>

</body>

</html>
